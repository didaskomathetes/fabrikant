# P0 proof: general-purpose workflows (research + admin)
# Research = read-only, external content is marked untrusted (guiding principle 7)
name: selftest
description: "P0 proof — general-purpose workflows (research, admin)"
root: ~/src/fabrikant  # adjust to your local checkout
env:
  topic: "fabrikant P0 selftest"
loops:
  research:
    description: "Topic/issue → triage → fetch → synthesis → report (read-only, T2)"
    tier: 2
    triggers:
      - {type: on_issue, repo: didaskomathetes/fabrikant, labels: [fabrikant-research], poll: 300}
    steps:
      - name: triage
        type: llm
        prompt: |
          Classify the topic/issue. Answer ONLY with JSON, without Markdown.
          Topic hint: {topic}
          Issue title: {issue_title}
          Issue: {issue_body}
          Answer schema: {"class": "research|config|bug|other", "priority": "low|medium|high", "topic": "<short topic>"}
        untrusted: [issue_title, issue_body]
        schema:
          class: string
          priority: string
          topic: string
      - name: fetch
        type: http
        url: https://example.com
        expect: {status: 200}
        emit:
          page: body
        timeout: 30
      - name: synthesis
        type: llm
        prompt: |
          Summarize the untrusted web data on the topic '{topic}' in at most 4 sentences (German).
          Answer ONLY with JSON. Answer schema: {"summary": "..."}
        untrusted: [page]
        schema:
          summary: string
      - name: report
        type: report
        write: reports/{run_id}-{class}.md
        text: |
          # Research report {run_id}
          - Class: {class} · Priority: {priority} · Topic: {topic}
          - Source: example.com

          ## Summary
          {summary}
      - name: notify
        type: notify
        message: "fabrikant: research {run_id} — {class}/{priority}: {topic}"
  admin-backup-check:
    description: "Verify backup freshness (T1: auto after checks)"
    tier: 1
    triggers:
      - {type: cron, cron: "0 7 * * *"}
    steps:
      - name: check
        type: shell
        cmd: |
          test -d /data/backup && find /data/backup -type f -mtime -2 | head -1
        timeout: 30
      - name: report
        type: report
        text: "Backup check {run_id}: ok (fresh files in /data/backup)"
      - name: notify
        type: notify
        message: "fabrikant: backup-check {run_id} ok"
  agent-smoke:
    description: "P1 proof: agent backend (opencode) writes a file in an isolated workdir (T2)"
    tier: 2
    steps:
      - name: cleanup
        type: shell
        cmd: rm -rf /tmp/fabrikant-agent-smoke && mkdir -p /tmp/fabrikant-agent-smoke
        timeout: 15
      - name: agent
        type: agent
        backend: opencode
        workdir: /tmp/fabrikant-agent-smoke
        prompt: |
          Use the write tool to create the file /tmp/fabrikant-agent-smoke/smoke.txt
          with the content: fabrikant agent ok.
          Use the ABSOLUTE path as given. At the end, answer in one sentence.
        timeout: 1800
      - name: verify
        type: shell
        workdir: /tmp/fabrikant-agent-smoke
        cmd: test -f smoke.txt && cat smoke.txt
        timeout: 15
