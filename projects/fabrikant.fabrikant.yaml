# Fabrikant dogfooding: Fabrikant develops Fabrikant.
# Repo: didaskomathetes/fabrikant.
# ADR: docs/adr/0001-dogfooding-loops.md
#
# root = git repo root.
# Branch switching at runtime (UI): ADR 0004 (state/branch-overrides.json).
name: fabrikant
description: "Fabrikant dogfooding: Fabrikant develops Fabrikant — {repo}"
root: $FABRIKANT_REPO_ROOT  # path of your local checkout (set in fabrikant.env)
repo:
  branch: main
github: "{repo}"

# Variables (ADR 0047): `{name}` applies everywhere in the spec and in the loop templates.
# A fork/second instance only changes this block.
vars:
  repo: didaskomathetes/fabrikant
  # 2026-10-24: switched from claude_code to a hosted opencode provider.
  # 2026-11-03: switched to a local llama.cpp server (session hangs, cost, latency).
  builder_backend: opencode
  # Builder model = configuration (ADR 0022) — pr-reply uses the same one as develop.
  builder_model: llama/ukisai_Swift-1.5-Qwen3.8-27b-IQ4_XS
  # Reasoning effort (opencode variant) for all builder steps; the model's default took too long (timeouts).
  builder_variant: medium
  # Lint/test gate of develop and refactor (single source). lint.sh: ruff + pyright + bandit (as in CI).
  lint_cmd: bash scripts/lint.sh
  test_cmd: uv run pytest -m "not browser"
  # Cross-model reviewer (ADR 0001): ≠ builder. 2026-10-23: Copilot (gpt-5.6-luna) → 402
  # monthly quota; 2026-11-04: local Qwen via opencode (llama.cpp server, max_parallel: 1).
  reviewer_backend: opencode
  reviewer_model: llama/Qwen3.8-27B-GGUF
  # Merge gate pinned instead of the active chat provider; llama-cpp (Qwen) = not the builder model.
  gate_provider: llama-cpp
  fast_poll: 60
  # Phase labels from framework-v1-draft §6 as priority (ADR 0021):
  # p0 before p1 … before unlabeled issues, oldest first within a level.
  priority_labels: [p0, p1, p2, p3]

notify:
  github_issue: true
  # Dedicated alert label: NOT 'fabrikant' — otherwise refine/develop pick up the
  # failure alerts as development tasks (feedback loop, Oct 2026).
  issue_labels: [fabrikant-alert]
  events: [run_failed]

# Prompt context for LLM nodes that write/review code (extra_context, README).
# Not project-wide: worktree:false loops (refine, approval) have no AGENTS.md in the workdir.
# Not for pure Copilot nodes (review-pr): Copilot loads AGENTS.md itself.
x-context:
  agents-md: &agents_md {name: agents_md, file: AGENTS.md, trusted: true}

# Shared step building blocks (YAML anchors) for refine + deps-backfill (ADR 0031).
# Not part of the spec schema — the engine ignores the key.
x-shared-steps:
  # Context for duplicate/blocker detection: the other open fabrikant issues as a
  # compact list (#N [labels] title — body excerpt), excluding the issue itself.
  list-open: &list_open_step
    name: list-open
    type: issue
    action: list
    repo: "{repo}"
    labels: [fabrikant]
    state: open
    limit: 100
    emit: open_issues
  list-closed: &list_closed_step
    name: list-closed
    type: issue
    action: list
    repo: "{repo}"
    labels: [fabrikant]
    state: closed
    limit: 30  # most recently updated — for "already solved" / "already exists"
    emit: closed_issues
  dependencies: &dependencies_step
    name: dependencies
    type: llm
    provider: claude  # pinned like classify (#80)
    prompt: |
      You are checking the dependencies of issue #{issue_number} in the Fabrikant project
      ({repo}).
      Development only starts an issue once all of its blockers are done.
      A wrong blocker holds the issue back needlessly; a missing one lets it start on a
      foundation that does not exist yet.

      1. blocked_by: open issues from open_issues that MUST be implemented BEFORE,
         because this issue builds directly on their result (a mechanism, step type,
         API, data structure or ADR decision first introduced there). NOT for merely
         related topics, desired ordering or phase labels. A reference such as
         "Depends on #N" in the issue text counts if #N is in open_issues. Only numbers
         from open_issues, at most 5, format "#12, #14"; otherwise "".
      2. Missing prerequisite (prerequisite_*): Does the issue presuppose a mechanism,
         concept or decision that is neither implemented (see closed_issues) nor covered
         by an issue in open_issues? Example: the issue distinguishes deployment
         profiles/operating modes (homelab|cloud), but there is neither the mechanism
         nor an issue for it. Then describe EXACTLY ONE such prerequisite as a new
         issue — the smallest foundation this issue can build on, not the whole
         feature. If an open issue covers it only as a small part of a much larger scope,
         a narrow foundation is the right call. Otherwise empty strings.

      Answer ONLY with JSON, without Markdown. All three keys are required ("" if not applicable):
      {
        "blocked_by": "<e.g. '#12, #14' or ''>",
        "prerequisite_title": "<title of the missing prerequisite without prefix, or ''>",
        "prerequisite_body": "<Markdown: ## Problem, ## Proposal, ## Acceptance Criteria; or ''>"
      }
    untrusted: [issue_title, issue_body, open_issues, closed_issues]
    schema:
      blocked_by: {type: string, default: ""}
      prerequisite_title: {type: string, default: ""}
      prerequisite_body: {type: string, default: ""}
  # Missing prerequisite as its own issue (label fabrikant → itself goes through refine:
  # duplicate check, possibly needs approval). Priority is inherited from the dependent issue,
  # otherwise the prerequisite would be handled last as unprioritized (ADR 0021).
  create-prerequisite: &create_prerequisite_step
    name: create-prerequisite
    type: issue
    action: create
    repo: "{repo}"
    number: "{issue_number}"  # source for inherit_labels
    skip_if_empty: [prerequisite_title]
    title: "fabrikant: {prerequisite_title}"
    body: |
      {prerequisite_body}

      ---
      Prerequisite for #{issue_number} — created automatically by the dependency check (ADR 0031).
    labels: [fabrikant]
    inherit_labels: [p0, p1, p2, p3]
    emit: prerequisite_number  # issue_number stays the issue being processed
  # Blockers as native GitHub dependencies. Hallucinated/closed references
  # are skipped by the step; other API errors abort the run (fail closed).
  # {prerequisite_number} stays unresolved without create-prerequisite and is ignored
  # as a non-reference.
  link-blockers: &link_blockers_step
    name: link-blockers
    type: issue
    action: block
    repo: "{repo}"
    number: "{issue_number}"
    skip_if_empty: [blocked_by, prerequisite_number]
    blocked_by: "{blocked_by}"
    prerequisite: "#{prerequisite_number}"  # separate: never counts toward the blocker limit

max_parallel: 1  # llama-cpp only handles one connection
loops:
  # ── 1. Refine: new fabrikant issue → refine (AC + background) → label or close proposal (human gate only for needs approval / close proposed, ADR 0017) ──
  # ADR: docs/adr/0006-issue-refine-loop.md
  refine:
    description: "Issue refine: AC + background for the issue, label (ready for development | needs approval | close proposed) — human gate only for needs approval and before every close (ADR 0017)"
    tier: 1
    worktree: false  # llm + gh only — runs in parallel with develop & co. (ADR 0020)
    triggers:
      - type: on_issue
        repo: "{repo}"
        labels: [fabrikant]
        poll: "{fast_poll}"  # s; GitHub API budget uncritical (3 loops × 60/h)
        reconcile: true  # work through the backlog after a restart (ADR 0014)
        max_per_poll: 2
        # Phase labels from framework-v1-draft §6 as priority (ADR 0021):
        # p0 before p1 … before unlabeled issues, oldest first within a level.
        priority_labels: "{priority_labels}"
    # Auto-retry (ADR 0036): restarts/network errors heal themselves (steps with
    # idempotency guards). Approval gate per attempt → keep max small (ADR 0036,
    # consequences).
    retry:
      max: 2
      backoff: [5m, 30m]
      "on": [interrupted, transient]
      max_wait: 24h
    steps:
      - *list_open_step
      - *list_closed_step
      - name: classify
        type: llm
        # Pinned instead of the active chat provider: the local Qwen produced
        # broken JSON (#80, unescaped characters in acceptance_criteria).
        provider: claude
        prompt: |
          Du bist der Refine-Agent für das Fabrikant-Projekt ({repo}).
          Lies das Issue und refine es: schreibe Acceptance Criteria und einen kurzen
          Hintergrund zum Issue (Ursache/Kontext — bei Feature Requests: Motivation und
          erwartetes Verhalten).

          Issue-Titel: {issue_title}
          Issue-Body: {issue_body}

          Acceptance-Criteria-Format (ADR 0013): Jedes Kriterium als eigene Zeile
          `- [ ] <Kriterium> — Prüfung: <Test | Befehl | Beobachtung>`. Der Prüfhinweis
          sagt, wie ein Reviewer das Kriterium prüfen kann (Test, Befehl oder
          Beobachtung) — er ist ein Hinweis für den Reviewer, KEIN ausführbares Kommando.

          Regeln (ADR 0017) — "ready for development" ist der Normalfall:
          - "ready for development": jede umsetzbare Aufgabe, die keinen der
            needs-approval-Gründe erfüllt. Dazu gehören ausdrücklich: Bugfixes,
            Refactorings, Tests, Doku, additive Features, neue Optionen/Steps/Trigger
            im bestehenden Muster und Änderungen an Engine-Code, solange sie eine
            bestehende ADR umsetzen statt ihr zu widersprechen. Kleine offene
            Detailfragen klärt die Entwicklung; nenne sie in den Acceptance Criteria.
          - "needs approval": NUR wenn mindestens einer dieser Gründe zutrifft
            (Grund in reasoning nennen):
            1. Architektur: braucht eine neue ADR, ändert/ersetzt eine bestehende ADR
               oder widerspricht einer (docs/adr/*.md).
            2. Sehr groß: mehrere unabhängige Teilsysteme oder eher Epic als Issue,
               sollte vor der Umsetzung geschnitten werden.
            3. Kritisch: Security-Modell (Auth, Secrets, Rechte, Signaturen),
               Datenschutz/DSGVO (personenbezogene Daten), Lizenz/Recht, laufende
               Kosten oder schwer umkehrbare Änderungen (Datenmigration, Löschen,
               Breaking Change an Spec-Format oder öffentlicher API).
            Dass ein Issue Engine, Steps oder ein ADR-Thema nur berührt, ist KEIN Grund.
          - "close proposed": Duplikat eines anderen Issues (close_kind "duplicate"), bereits
            gelöst (close_kind "completed") — beides mit #N-Referenz — oder nicht
            sinnvoll (close_kind "not_planned").

          Duplikat-Prüfung: Vergleiche das Issue mit den Listen open_issues (offen) und
          closed_issues (zuletzt geschlossen). Beschreibt eines davon im Kern DIESELBE
          Aufgabe, ist das Issue ein Duplikat ("close proposed", close_reason "Duplikat von #N"
          bzw. "bereits gelöst in #N"). Nur bei klarer inhaltlicher Übereinstimmung —
          ein ähnliches Thema oder derselbe Bereich ist KEIN Duplikat. Im Zweifel kein
          Duplikat; einen engen Bezug in reasoning nennen. Abhängigkeiten prüft ein
          eigener Step — sie sind kein Grund für "close proposed" oder "needs approval".

          Das Issue wird in jedem Fall (außer close proposed) refinert. "ready for development"
          geht OHNE menschliche Freigabe direkt in die Entwicklung — dort sichern
          human_gate (ADR-Pfade, Diff-Größe) und PR-Review ab. "needs approval" und
          "close proposed" legt die Fabrik einem Menschen vor; geschlossen wird erst nach
          Freigabe. Im Zweifel zwischen
          "ready for development" und "needs approval": "ready for development", außer
          einer der Gründe 1–3 trifft wahrscheinlich zu.

          Antworte NUR mit JSON, ohne Markdown. Alle sieben Keys sind Pflicht —
          nicht zutreffende Felder als leeren String "" angeben, nie weglassen.
          Antwort-Schema:
          {
            "label": "ready for development" | "needs approval" | "close proposed",
            "reasoning": "<1-2 Sätze Begründung>",
            "background": "<1-3 Sätze: Hintergrund zum Issue (Ursache/Kontext/Motivation); bei 'close proposed' leerer String>",
            "acceptance_criteria": "<bei 'ready for development' und 'needs approval': Markdown-Liste mit 2-5 konkreten, testbaren Kriterien, jedes als '- [ ] <Kriterium> — Prüfung: <Test | Befehl | Beobachtung>' (ADR 0013); bei 'close proposed' leerer String>",
            "close_reason": "<nur bei 'close proposed': Begründung (Duplikat von #N / bereits gelöst / nicht sinnvoll) mit Referenz; sonst leerer String>",
            "close_kind": "<nur bei 'close proposed': 'duplicate' | 'completed' (bereits gelöst) | 'not_planned' (nicht sinnvoll); sonst leerer String>",
            "duplicate_of": "<nur bei close_kind 'duplicate': '#N' des Originals; sonst leerer String>"
          }
        untrusted: [issue_title, issue_body, open_issues, closed_issues]
        schema:
          # enum whitelist: label ends up in shell commands (apply-label) —
          # the llm step rejects deviations (ok: False), so injection is
          # impossible at the source.
          label:
            type: string
            enum: ["ready for development", "needs approval", "close proposed"]
          reasoning: string
          # default: LLMs omit empty fields despite the prompt (#80) — a missing
          # key → "" instead of a schema error. Only for fields that may be empty.
          background: {type: string, default: ""}
          acceptance_criteria: {type: string, default: ""}
          close_reason: {type: string, default: ""}
          # Close reason → GitHub state_reason: only `completed` releases dependent issues
          # (ADR 0031). Empty = GitHub default completed.
          close_kind:
            type: string
            enum: ["", "duplicate", "completed", "not_planned"]
            default: ""
          duplicate_of: {type: string, default: ""}
      # With close proposed the result is unused (no blockers/prerequisites) → save the LLM call.
      - <<: *dependencies_step
        only_if: &refined_labels
          label: ["ready for development", "needs approval"]
      # Native issue steps (ADR 0001 §5): values go to the GitHub API as a JSON
      # payload, never through a shell — LLM text (background, close_reason, …)
      # cannot inject anything. GitHub creates missing labels when they are added.
      - name: refine-body
        type: issue
        action: edit
        repo: "{repo}"
        number: "{issue_number}"
        skip_if_empty: [background, acceptance_criteria]
        append: true
        # Idempotency guard: marker in the body → re-run is a no-op.
        unless_contains: "<!-- Refine (auto) -->"
        body: |
          <!-- Refine (auto) -->
          ## Hintergrund (auto)
          {background}

          ## Acceptance Criteria (auto)
          {acceptance_criteria}
      # Prerequisites + blockers BEFORE apply-label (ADR 0031): develop never sees the label
      # without the associated blockers. With close proposed no new issues/relations.
      - <<: *create_prerequisite_step
        only_if: *refined_labels
      - <<: *link_blockers_step
        only_if: *refined_labels
      # Close proposal: reasoning immediately visible in the body so the approval on
      # GitHub is traceable (the issue step has no comment-only action).
      - name: propose-close
        type: issue
        action: edit
        repo: "{repo}"
        number: "{issue_number}"
        only_if:
          label: "close proposed"
        append: true
        unless_contains: "<!-- Close-Vorschlag (auto) -->"
        body: |
          <!-- Close-Vorschlag (auto) -->
          ## Close-Vorschlag (auto)
          {close_reason}
      # Human gate only for needs approval and close proposed (ADR 0017): ready for
      # development runs through without a pause — develop is safeguarded by human_gate +
      # PR review (ADR 0010).
      - name: apply-label
        type: issue
        action: label
        repo: "{repo}"
        number: "{issue_number}"
        # Make the label visible immediately — also 'needs approval' and 'close proposed'.
        labels: ["{label}"]
      - name: promote
        type: issue
        action: label
        repo: "{repo}"
        number: "{issue_number}"
        # Approval = "may be developed": needs approval → ready for development
        # (develop triggers). Reject ends the run, the label stays.
        approval_when:
          label: "needs approval"
        only_if:
          label: "needs approval"
        remove_labels: ["needs approval"]
        labels: ["ready for development"]
      - name: close-issue
        type: issue
        action: close
        repo: "{repo}"
        number: "{issue_number}"
        # Close with the reasoning as a comment — issues are closed, NOT deleted.
        # Gate before every close (ADR 0017): duplicate/"solved" detection can be
        # wrong, a completed close releases dependents (ADR 0031) and a reopen
        # does not trigger refine again. Reject: run ends, 'close proposed' stays.
        approval_when:
          label: "close proposed"
        only_if:
          label: "close proposed"
        comment: "{close_reason}"
        state_reason: "{close_kind}"
        # Duplicate: close as duplicate and re-point dependent issues to the original.
        duplicate_of: "{duplicate_of}"
      - name: report
        type: report
        text: "Refine #{issue_number}: **{label}** — {reasoning} (blockers: {blocked_by}; prerequisite: {prerequisite_title})"

  # ── 2. Develop (dual-identity, ADR 0010): triggered issue → PR → LLM review → merge ──
  # Refine (loop 1) routes: "ready for development" → here, "needs approval" → human.
  # Human in the loop ONLY for critical changes (human_gate: ADR paths, diff size, keywords, LLM).
  # Instance of the template templates/develop.loop.yaml (ADR 0047).
  develop:
    use: develop
    description: "Issue development (dual-identity, ADR 0010): refined issues → PR → LLM review (PAT) → merge (human only for critical changes)"
    with:
      prompt_file: prompts/fabrikant-develop.prompt.md
      builder_model: "{builder_model}"
      builder_variant: "{builder_variant}"
      reviewer_model: "{reviewer_model}"
      lint_cmd: "{lint_cmd}"
      # coverage.xml for the quality report in the review step (sonar-scan.sh --pr reuses it)
      test_cmd: uv run pytest -m "not browser" --cov=src --cov-report=xml:coverage.xml
      adr_paths: [docs/adr]  # PR paths are repo-relative
      builder_context: [*agents_md]
      # Review + fix round (builder). quality: Sonar scan of the PR head under its own key,
      # report (Sonar issues + lint via ruff/mypy on changed lines, diff coverage)
      # as a PR comment + prompt context; re-runs every round (advisory, README
      # "sonar-scan PR mode"). agents_md stays: the same context also goes to the
      # fix round (builder claude_code), which does not load AGENTS.md itself.
      review_context:
        - *agents_md
        - {name: quality, cmd: "bash scripts/sonar-scan.sh --pr {pr_number} --post", trusted: true, timeout: 1800}
    # Safeguard ADR numbers deterministically (ADR 0032): rename new ADRs whose number is
    # already taken on main (the new number also skips open PRs; their
    # collisions are caught by the merge-check gate), then verify. Before lint/test so the
    # repair is tested too and committed by ship.
    insert:
      - after: changes
        steps:
          - name: check-adr
            type: shell
            cmd: uv run python scripts/check-adr-numbers.py fix && uv run python scripts/check-adr-numbers.py check
            timeout: 300

  # ── 2b. Deps backfill (one-off, ADR 0031): backlog from before the dependency check was introduced ──
  # Runs exactly once per open fabrikant issue (run records, ADR 0014) and only sets
  # blockers + missing prerequisites — no relabel, no close. Procedure:
  #   1. fabrikant pause fabrikant develop    (otherwise develop starts issues before their blockers)
  #   2. Let the backlog drain (runs view: deps-backfill)
  #   3. fabrikant disable fabrikant deps-backfill && fabrikant resume fabrikant develop
  # New issues are covered by refine (same step building blocks).
  # As of 2026-10-23: backfill finished, loop deactivated via `fabrikant disable`
  # (otherwise it checks new issues twice alongside the refine loop).
  deps-backfill:
    description: "One-off dependency backfill (ADR 0031): blockers + missing prerequisites for already refined issues — pause develop meanwhile, then deactivate the loop"
    tier: 1
    worktree: false  # issue + llm + report only (API) — needs no slot (ADR 0020)
    triggers:
      # One trigger (poll state is per loop, a second on_issue trigger would never fire).
      - type: on_issue
        repo: "{repo}"
        labels: [fabrikant]
        reconcile: true
        # 1 run per 120 s: a run (3 API calls + 1 LLM call) is usually done
        # before the next one starts — so it sees the previous one's prerequisite in
        # open_issues. No hard serialization guarantee; duplicate prerequisites
        # are caught by the duplicate check in refine (close duplicate_of re-points blockers).
        poll: 120
        max_per_poll: 1
        priority_labels: "{priority_labels}"
    # Auto-retry (ADR 0036): restarts/network errors heal themselves (steps with
    # idempotency guards; duplicates are caught by the refine duplicate check).
    retry:
      max: 3
      backoff: [5m, 30m, 2h]
      "on": [interrupted, transient]
      max_wait: 24h
    steps:
      - *list_open_step
      - *list_closed_step
      - *dependencies_step
      - *create_prerequisite_step
      - *link_blockers_step
      - name: report
        type: report
        text: "Deps backfill #{issue_number}: blockers {blocked_by}; prerequisite: {prerequisite_title}"

  # ── 3. Refactor (targeted): manual with --var target=... ──
  refactor:
    description: "Targeted refactoring of a module/area — manual (fabrikant run refactor --var target=src/fabrikant/engine.py)"
    tier: 2
    triggers:
      - type: manual
    steps:
      - name: prepare
        type: git
        branch: fabrikant/refactor-{run_id}
      - name: refactor
        type: agent
        backend: "{builder_backend}"
        model: "{builder_model}"
        variant: "{builder_variant}"
        prompt_file: prompts/fabrikant-refactor.prompt.md
        extra_context: [*agents_md]
        timeout: 3600
      - name: lint
        type: shell
        cmd: "{lint_cmd}"
        timeout: 300
        failure_kind: outcome
      - name: test
        type: shell
        cmd: "{test_cmd}"
        timeout: 900
        failure_kind: outcome
      - name: ship
        type: git
        commit:
          add: [":/"]  # repo root
          message: "refactor(fabrikant): {target} (auto)"
        push: true
      - name: pr
        type: pr
        repo: "{repo}"
        base: main
        head: fabrikant/refactor-{run_id}
        labels: [fabrikant]  # review-pr/pr-reply filter on this label
        title: "refactor(fabrikant): {target} (auto)"
        body: |
          Targeted refactoring via the fabrikant loop `refactor`.

          - Target: {target}
          - Behavior unchanged, all tests green
          - Lint + format green
        approval: true

  # ── 4. Refactor sweep: find code smells → issues (label fabrikant → refine → develop) ──
  refactor-sweep:
    description: "On-demand sweep (manual): code smells/complexity from the latest SonarQube main analysis → refactoring issues (max. 3 per run)"
    tier: 2
    triggers:
      - type: manual
    steps:
      # The agent only analyzes and returns JSON; native issue steps create the
      # issues (ADR 0001 §5) — no gh in the agent, no shell quoting of title/body.
      - name: sweep
        type: agent
        backend: "{builder_backend}"
        model: "{builder_model}"
        variant: "{builder_variant}"
        prompt_file: prompts/fabrikant-refactor-sweep.prompt.md
        extra_context: [*agents_md]
        timeout: 1800
      - name: extract-candidates
        type: llm
        provider: claude  # pinned like classify (#80: local Qwen produced broken JSON)
        untrusted: [last_agent_output]
        prompt: |
          Extract the refactoring candidates from the sweep result (JSON list
          "candidates", max. 3). Missing candidates = empty strings.
          Answer schema: {"title_1": "", "body_1": "", "title_2": "", "body_2": "", "title_3": "", "body_3": ""}
        # default: missing candidate keys → "" instead of a schema error (#80)
        schema:
          title_1: {type: string, default: ""}
          body_1: {type: string, default: ""}
          title_2: {type: string, default: ""}
          body_2: {type: string, default: ""}
          title_3: {type: string, default: ""}
          body_3: {type: string, default: ""}
      - name: create-issue-1
        type: issue
        action: create
        repo: "{repo}"
        skip_if_empty: [title_1]
        title: "refactor(fabrikant): {title_1}"
        body: "{body_1}"
        labels: [fabrikant, refactor]
      - name: create-issue-2
        type: issue
        action: create
        repo: "{repo}"
        skip_if_empty: [title_2]
        title: "refactor(fabrikant): {title_2}"
        body: "{body_2}"
        labels: [fabrikant, refactor]
      - name: create-issue-3
        type: issue
        action: create
        repo: "{repo}"
        skip_if_empty: [title_3]
        title: "refactor(fabrikant): {title_3}"
        body: "{body_3}"
        labels: [fabrikant, refactor]
      - name: report
        type: report
        text: "Refactor sweep {run_id}: candidates checked, issues created if needed (see agent output)."

  # ── 5. Review-on-PR: new/updated fabrikant PRs — cross-model (different model than the builder) ──
  # Instance of the template templates/review-pr.loop.yaml (ADR 0047; on_pr trigger, ADR 0001 §4).
  review-pr:
    use: review-pr
    description: "Code review of new/updated fabrikant PRs — local Qwen reviewer ({reviewer_model} via {reviewer_backend}, builder ≠ reviewer, guiding principle 4)"
    with:
      prompt_file: prompts/fabrikant-review.prompt.md
      reviewer_model: "{reviewer_model}"
      # No review_context with AGENTS.md: Copilot loads it itself (otherwise it is doubled in the context).
    # Auto-retry (ADR 0036): hanging review sessions/network errors heal
    # themselves; every attempt passes the on_pr gate again (reconcile: head).
    retry:
      max: 3
      backoff: [5m, 30m, 2h]
      "on": [interrupted, transient]
      max_wait: 24h

  # ── 6. PR reply: new comments on fabrikant PRs — builder model (replies + fixes code) ──
  pr-reply:
    description: "Reply to new comments on fabrikant PRs + code fix on the PR branch — builder model (as in develop, YAML anchor builder_model, ADR 0022)"
    tier: 1
    triggers:
      - type: cron
        cron: "*/5 * * * *"
    steps:
      - name: reply
        type: agent
        backend: "{builder_backend}"
        model: "{builder_model}"
        prompt_file: prompts/fabrikant-pr-reply.prompt.md
        extra_context: [*agents_md]
        timeout: 1800

  # ── 7. SonarQube scan: code quality (Python via pysonar) — daily on main ──
  # Baseline for "New Code" of the PR analyses (sonar-pr). docs/sonarqube.md
  sonar-scan:
    description: "SonarQube code quality scan (pysonar) — daily (main); quality gate must be OK; cleans up orphaned legacy PR projects (ADR 0053, advisory)"
    tier: 1
    triggers:
      - type: cron
        cron: "0 6 * * *"
    steps:
      - name: scan
        type: shell
        cmd: bash scripts/sonar-scan.sh
        timeout: 900
        failure_kind: outcome  # quality gate/tests red (ADR 0035); the script reports server/setup errors via exit 75/78/127
      - name: report
        type: report
        text: "SonarQube scan {run_id}: quality gate OK (projectKey=fabrikant:fabrikant)"

  # ── 7b. SonarQube PR analysis (community branch plugin, compose.yaml) → result as a PR comment ──
  # Without GitHub checks permission and without an LLM: the script renders the comment from the scan results
  # (scripts/sonar_report.py), gh-upsert-comment.sh posts it as the reviewer app (one per PR, updated per push).
  sonar-pr:
    description: "SonarQube PR analysis (latest head, at most every 30 min) → gate, coverage and issues as a PR comment (reviewer app); quality gate must be OK"
    tier: 1
    triggers:
      - type: on_pr
        repo: "{repo}"
        # Debounce: per poll only the current head SHA counts (reconcile: head, ADR 0023) — pushes
        # within an interval result in one scan of the latest state; dropped triggers are caught up.
        poll: 1800
        reconcile: head
    steps:
      - name: scan
        type: shell
        # Exit 1 WITH report = gate red → comment anyway (the gate step evaluates at the end);
        # exit 1 without report (tests red) and 75/78/127 abort here.
        cmd: bash scripts/sonar-scan.sh || { rc=$?; [ "$rc" -eq 1 ] && [ -s .fabrikant/sonar/report.json ] || exit "$rc"; }
        env:
          SONAR_PR_HEAD_REF: "{pr_head_ref}"  # untrusted → env (ADR 0008); checkout in the script
          SONAR_PR: "{pr_number}"
          SONAR_REPORT_FILE: .fabrikant/sonar/report.json
          SONAR_COMMENT_FILE: .fabrikant/sonar/comment.md
          SONAR_LINK_BASE: "https://github.com/{repo}/blob/{pr_head_sha}"
        timeout: 900
        failure_kind: outcome
      - name: post
        type: shell
        cmd: bash scripts/gh-upsert-comment.sh "{repo}" {pr_number} "<!-- fabrikant-sonar -->" .fabrikant/sonar/comment.md
        timeout: 60
      - name: gate
        type: shell
        cmd: python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["status"]; print("Quality Gate:", s); sys.exit(s != "OK")' .fabrikant/sonar/report.json
        failure_kind: outcome

  # ── 7c. Escalation (ADR 0057): PR with 'needs human' → gate run; resuming removes the label ──
  escalation:
    use: escalation
    with:
      poll: "{fast_poll}"

  # ── 8. Approval (ADR 0011): ADR PR 'needs approval' → pause → human approves (UI/CLI) → merge ADR PR ──
  # Resolves the deadlock from ADR 0011: an agent (pr-reply) that needs a change
  # requiring human approval (ADR/spec, architecture) creates the
  # ADR as a draft and opens a stacked ADR PR (base = PR branch, label
  # 'needs approval'). This loop (reconcile) pauses at the approval gate; the
  # human approves via `fabrikant approve` (UI/CLI); the merge step merges the ADR PR.
  approval:
    description: "Approval request (ADR 0011): ADR PR (label 'needs approval') → pause → human approves (fabrikant UI/CLI) → merge ADR PR (stacked)"
    tier: 1
    worktree: false  # pr_merge only (API) — parallel (ADR 0020)
    triggers:
      - type: on_pr
        repo: "{repo}"
        # AND semantics (client-side): only fabrikant PRs with 'needs approval' —
        # 'needs approval' alone would also match non-fabrikant PRs.
        labels: [fabrikant, needs approval]
        reconcile: true
        poll: "{fast_poll}"
    steps:
      # Gate directly at the merge: the approval context shows "merge PR (squash)" +
      # PR title/link instead of a placeholder echo step.
      - name: merge-adr-pr
        type: pr_merge
        repo: "{repo}"
        method: squash
        approval: true
        approval_reason: "{pr_title}"
