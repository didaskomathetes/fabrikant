# P0-Proof: general-purpose Workflows (Research + Admin)
# Research = read-only, externer Content ist untrusted markiert (Leitprinzip 7)
name: selftest
description: "P0-Proof — general-purpose Workflows (research, admin)"
root: ~/PycharmProjects/fabrik
env:
  topic: "fabrik P0 selftest"
loops:
  research:
    description: "Topic/Issue → Triage → Fetch → Synthese → Report (read-only, T2)"
    tier: 2
    triggers:
      - {type: on_issue, repo: didaskomathetes/fabrik, labels: [fabrik-research], poll: 300}
    steps:
      - name: triage
        type: llm
        prompt: |
          Klassifiziere das Thema/Issue. Antworte NUR mit JSON, ohne Markdown.
          Themen-Hinweis: {topic}
          Issue-Titel: {issue_title}
          Issue: {issue_body}
          Antwort-Schema: {"class": "research|config|bug|other", "priority": "low|medium|high", "topic": "<kurzes Thema>"}
        untrusted: [issue_title, issue_body]
        schema:
          class: string
          priority: string
          topic: string
      - name: fetch
        type: http
        url: https://example.com
        expect: {status: 200}
        emit:
          page: body
        timeout: 30
      - name: synthese
        type: llm
        prompt: |
          Fasse die untrusted Web-Daten zum Thema '{topic}' in max. 4 Sätzen (Deutsch) zusammen.
          Antworte NUR mit JSON. Antwort-Schema: {"summary": "..."}
        untrusted: [page]
        schema:
          summary: string
      - name: report
        type: report
        write: reports/{run_id}-{class}.md
        text: |
          # Research-Report {run_id}
          - Class: {class} · Priority: {priority} · Thema: {topic}
          - Quelle: example.com

          ## Zusammenfassung
          {summary}
      - name: notify
        type: notify
        message: "fabrik: research {run_id} — {class}/{priority}: {topic}"
  admin-backup-check:
    description: "Backup-Frische verifizieren (T1: auto nach Checks)"
    tier: 1
    triggers:
      - {type: cron, cron: "0 7 * * *"}
    steps:
      - name: check
        type: shell
        cmd: |
          test -d /data/backup && find /data/backup -type f -mtime -2 | head -1
        timeout: 30
      - name: report
        type: report
        text: "Backup-Check {run_id}: ok (frische Dateien in /data/backup)"
      - name: notify
        type: notify
        message: "fabrik: backup-check {run_id} ok"
  agent-smoke:
    description: "P1-Proof: Agent-Backend (opencode) schreibt Datei im isolierten Workdir (T2)"
    tier: 2
    steps:
      - name: cleanup
        type: shell
        cmd: rm -rf /tmp/fabrik-agent-smoke && mkdir -p /tmp/fabrik-agent-smoke
        timeout: 15
      - name: agent
        type: agent
        backend: opencode
        workdir: /tmp/fabrik-agent-smoke
        prompt: |
          Erstelle mit dem write-Tool die Datei /tmp/fabrik-agent-smoke/smoke.txt
          mit dem Inhalt: fabrik agent ok.
          Nutze den ABSOLUTEN Pfad, wie angegeben. Antworte am Ende in einem Satz.
        timeout: 1800
      - name: verify
        type: shell
        workdir: /tmp/fabrik-agent-smoke
        cmd: test -f smoke.txt && cat smoke.txt
        timeout: 15
