# Loop-Vorlage `review-pr`: Cross-Model-Code-Review neuer/aktualisierter PRs mit Label.
# Einbindung (ADR 0047):  review-pr: {use: review-pr, with: {prompt_file: ..., model: ...}}
# `params`: Defaults; `null` = Pflicht (per `with:` oder Spec-`vars:`).
params:
  repo: null
  prompt_file: null  # Review-Prompt (relativ zur Spec, Fallback FABRIK_HOME)
  reviewer_model: null  # ≠ Builder-Modell (Leitprinzip 4)
  reviewer_backend: copilot
  pr_label: fabrik  # manuelle/Refactor-PRs; develop-PRs tragen `fabrik-develop` (kein Doppel-Review, ADR 0010)
  poll: 300
  timeout: 1800
  review_context: []  # extra_context des Review-Steps
loop:
  description: "Code-Review neuer/aktualisierter PRs mit Label {pr_label} — Reviewer {reviewer_model} via {reviewer_backend} (Builder ≠ Reviewer)"
  tier: 1
  triggers:
    - type: on_pr
      repo: "{repo}"
      labels: ["{pr_label}"]
      poll: "{poll}"
      # Pro Head-SHA reconcilen (ADR 0023): ein wegen belegtem Projekt-Lock verworfener
      # Trigger wird nachgeholt; Kommentare ohne Push lösen keinen Re-Review aus.
      reconcile: head
  steps:
    - name: review
      type: agent
      backend: "{reviewer_backend}"
      model: "{reviewer_model}"
      prompt_file: "{prompt_file}"
      extra_context: "{review_context}"
      timeout: "{timeout}"
