[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabrik"
version = "0.1.0"
description = "fabrik — die Software-Fabrik: agentic Development-Loops als YAML-Specs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "cryptography>=50.0.2",
    "pysonar>=1.9.0.5762",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# OIDC-Login (ADR 0046): ID-Token-Signaturprüfung braucht Krypto außerhalb der Stdlib.
oidc = ["pyjwt[crypto]>=2.8"]

[project.scripts]
fabrik = "fabrik.cli:main"
fabrik-mcp = "fabrik.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrik"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "playwright>=1.40",
    "pytest-xdist>=3.8.0",
    "pyright[nodejs]>=1.1.408",
    "bandit>=1.8",
    "diff-cover>=10.6.0",
    "pyjwt[crypto]>=2.8",
    "pip-audit>=2.10.1",
]

[tool.sonar]
# SonarQube-Projekt-Key (pysonar-Scanner, s. scripts/sonar-scan.sh + Loop `sonar-scan`).
# sources/test sind KOMMA-getrennte Strings (SonarQube-Scanner-Format), keine Listen.
projectKey = "quark-playground:fabrik"
projectName = "Fabrik"
projectVersion = "0.1.0"
sources = "src"
test = "tests"

[tool.pyright]
# Typecheck-Gate (scripts/lint.sh), Basic-Modus; strengere Modi schrittweise (wie zuvor mypy, Issue #18).
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Tests: Optional-Zugriffe auf Rückgabewerte sind implizite Assertions (None → AttributeError/TypeError
# lässt den Test ohnehin scheitern); alle übrigen Regeln gelten auch hier (veraltete Aufrufe nach API-Änderungen).
executionEnvironments = [
  { root = "tests", reportOptionalMemberAccess = false, reportOptionalSubscript = false },
  { root = "." },
]

[tool.bandit]
# SAST-Gate (scripts/lint.sh): gate ab Severity medium, alle übrigen Funde gehen als Report nach Sonar.
# Übersprungen: subprocess-Familie — die Fabrik orchestriert git/gh/uv per Argumentliste (ohne Shell);
# B602 (shell=True) bleibt aktiv.
skips = ["B404", "B603", "B607"]

[tool.coverage.report]
# Coverage-Gate der CI (AGENTS.md: >= 80 %; Ist-Stand ~96 %, Schwelle bewusst darüber gegen Erosion).
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["runs", "state", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length — handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: Playwright/Chromium-UI-Tests (brauchen installiertes Chromium)",
    "perf: Wall-Clock-Budget-Tests; seriell laufen lassen (nicht mit pytest-xdist -n)",
]
