# Opt-in Golden-Run-Eval (Roadmap #130).
#
# WICHTIG — Staging-Pfad: Diese Datei liegt vorübergehend unter `docs/ci/`,
# weil die GitHub-App die `workflows`-Write-Permission nicht hat und deshalb
# nichts nach `.github/workflows/` pushen darf. Endstandort:
# `.github/workflows/golden-eval.yml` (dorthin verschieben, sobald die
# Permission vorliegt). Inhalt ist final — nur der Pfad wandert.
#
# VORAUSSETZUNGEN (sonst endet der Job mit Exit 2 = Fehler, nicht Regression):
#  - Golden-Dateien speichern nur Run-IDs. Der Baseline-Run muss im Run-Store
#    des Runners existieren (gleiches FABRIK_HOME / gleicher Run-Store wie beim
#    `golden capture`) — ein frischer GitHub-hosted Runner hat ihn NICHT; nutze
#    einen self-hosted Runner oder stelle den Run-Store vorher wieder her.
#  - Backend-Secrets der Loop-Steps (z. B. API-Keys) und ein `gh`-Token
#    (GH_TOKEN) müssen im Job-Environment verfügbar sein.
#  - Exit 0 = keine Regression, 1 = Regression, 2 = Fehler/inkonklusiv.
#
# Wird NUR manuell ausgelöst (Actions → „golden-eval" → Run workflow) — läuft
# bewusst nicht auf jedem Push/PR. Zweck: "diese Pipeline-Änderung hat meine
# Loops nicht regressioniert" als prüfbare Aussage. Der Job schlägt fehl
# (Exit != 0), wenn der Replay einer gepinnten Golden-Baseline abweicht.
name: golden-eval

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Fabrik-Project (Name der *.fabrik.yaml)"
        required: true
      loop:
        description: "Loop-Name"
        required: true
      golden:
        description: "Golden-Name (leer = Loop-Name)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Golden eval (Exit 0 = keine Regression)
        env:
          PROJECT: ${{ github.event.inputs.project }}
          LOOP: ${{ github.event.inputs.loop }}
          GOLDEN: ${{ github.event.inputs.golden }}
          # Prerequisites (see header): same run store + backend secrets + gh token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FABRIK_HOME: ${{ vars.FABRIK_HOME }}  # must point at the run store holding the baseline run
        run: |
          set -euo pipefail
          GOLDEN_ARGS=()
          [ -n "$GOLDEN" ] && GOLDEN_ARGS+=(--name "$GOLDEN")
          # --yes: eval re-runs the loop for real (side effects!); in CI there is no TTY for the
          # prompt, and triggering this workflow manually is the explicit confirmation.
          uv run fabrik eval "$PROJECT" "$LOOP" "${GOLDEN_ARGS[@]+"${GOLDEN_ARGS[@]}"}" --yes
