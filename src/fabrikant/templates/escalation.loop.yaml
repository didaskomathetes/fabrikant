# Loop template `escalation` (ADR 0059): items with the label `needs human` → waiting gate run in the
# fabrikant UI/CLI. Approve = resume (label removed, loops continue), reject = give up
# (label stays). The label is set by `scripts/pr-status.py` (`escalate`, `escalation-check --escalate`).
# Usage (ADR 0047):  escalation: {use: escalation}
params:
  repo: null
  item_label: fabrikant  # fabrikant PRs only (AND with human_label)
  human_label: needs human
  poll: 60
loop:
  description: "Escalation (ADR 0059): PR with '{human_label}' → pause with reasoning → human resumes or gives up"
  tier: 1
  worktree: false  # GitHub API only (ADR 0020)
  triggers:
    - type: on_pr
      repo: "{repo}"
      labels: ["{item_label}", "{human_label}"]
      poll: "{poll}"
      # Reconcile per head SHA (ADR 0023): a renewed escalation after "resume" fires as soon as
      # the builder has pushed. While a run is paused, the claim blocks further runs (ADR 0043).
      reconcile: head
  steps:
    - name: wait-for-human
      type: escalation
      repo: "{repo}"
      label: "{human_label}"
