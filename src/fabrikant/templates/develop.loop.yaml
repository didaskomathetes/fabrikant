# Loop template `develop` (dual-identity, ADR 0010): triggered issue → branch → agent →
# lint/test → PR → LLM review → human gate (critical changes only) → merge.
# Usage (ADR 0047):  develop: {use: develop, with: {prompt_file: ..., lint_cmd: ..., ...}}
# `params`: defaults; `null` = required (via `with:` or spec `vars:`). Unknown {name}
# stay runtime variables of the engine. More steps: `insert: [{after: <step>, steps: [...]}]`.
params:
  repo: null  # owner/name — issues, PR, review, merge
  prompt_file: null  # builder prompt (relative to the spec, falls back to FABRIKANT_HOME)
  lint_cmd: null
  test_cmd: null
  builder_model: null  # builder model = configuration (ADR 0022)
  builder_variant: ""  # opencode: model variant (reasoning effort, e.g. medium); empty = model default
  reviewer_model: null  # cross-model reviewer: ≠ builder (ADR 0001)
  builder_backend: claude_code
  reviewer_backend: copilot
  gate_provider: copilot  # pinned: a UI toggle must not switch the merge gate
  base: main
  branch_prefix: fabrikant/auto
  issue_label: ready for development
  pr_label: fabrikant-develop  # develop PRs; review-pr/pr-reply filter on `fabrikant` (manual/refactor PRs) — deliberately separate, otherwise double review + human-gate bypass
  adr_paths: [docs/adr]  # repo-relative (monorepo: subdirectory prefix)
  commit_add: [":/"]  # repo root — workdir can be a subpath
  review_rounds: 2
  fix_timeout: 1800  # timeout per fix round of the PR review (builder session), s
  builder_timeout: 3600
  poll: 60
  priority_labels: [p0, p1, p2, p3]
  builder_context: []  # extra_context of the builder step (changes)
  review_context: []  # extra_context of the review step (pr_review: review and fix prompt)
  human_label: needs human  # do not (re)pick up escalated issues (ADR 0059)
loop:
  description: "Issue development (dual-identity, ADR 0010): issue → PR → LLM review → merge (human only for critical changes)"
  tier: 2
  triggers:
    - type: on_issue
      repo: "{repo}"
      labels: ["{issue_label}"]
      poll: "{poll}"
      reconcile: true  # work through the backlog after a restart (ADR 0014)
      max_per_poll: 2
      priority_labels: "{priority_labels}"  # ADR 0021
      exclude_labels: ["{human_label}"]
      # Never start with unresolved "blocked by" dependencies (ADR 0031).
      skip_blocked: true
  steps:
    - name: prepare
      type: git
      branch: "{branch_prefix}/{issue_number}"
    - name: changes
      type: agent
      backend: "{builder_backend}"
      model: "{builder_model}"
      variant: "{builder_variant}"
      prompt_file: "{prompt_file}"
      extra_context: "{builder_context}"
      timeout: "{builder_timeout}"
    - name: lint
      type: shell
      cmd: "{lint_cmd}"
      timeout: 300
      failure_kind: outcome  # red = genuine outcome (ADR 0035); exit 126/127/75/78 take precedence
    - name: test
      type: shell
      cmd: "{test_cmd}"
      timeout: 900
      failure_kind: outcome
    - name: ship
      type: git
      commit:
        add: "{commit_add}"
        message: "fabrikant: {issue_title} (Issue #{issue_number}, auto)"
      push: true
    - name: pr
      type: pr
      repo: "{repo}"
      base: "{base}"
      head: "{branch_prefix}/{issue_number}"
      labels: ["{pr_label}"]
      title: "fabrikant: {issue_title} (auto)"
      # `Closes #N`: GitHub closes the issue on merge (ADR 0013). Without issue_number,
      # no valid closing keyword is produced.
      body: |
        Closes #{issue_number}

        Created automatically by the fabrikant loop `develop` (issue #{issue_number}).

        Dual-identity pipeline (ADR 0010): developed by the agent app,
        reviewed by the repo owner (PAT).

        ## Changes
        - Implementation of the issue
        - Tests: `{test_cmd}` green
        - Lint: `{lint_cmd}` green
    - name: review
      type: pr_review
      repo: "{repo}"
      backend: "{reviewer_backend}"
      model: "{reviewer_model}"
      max_rounds: "{review_rounds}"
      extra_context: "{review_context}"
      fix_timeout: "{fix_timeout}"
      # Fix rounds commit after lint/test of `ship` — the same checks before every fix push.
      fix_checks: ["{lint_cmd}", "{test_cmd}"]
    - name: gate
      type: human_gate
      repo: "{repo}"
      provider: "{gate_provider}"
      adr_paths: "{adr_paths}"
    - name: merge
      type: pr_merge
      repo: "{repo}"
      method: squash
      # PR fell behind the base during review/gate → update before merging; conflict = red run
      # (failure alert). The update merge commit is not tested again (see pr_merge).
      update_branch: true
